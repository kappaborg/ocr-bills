name: receipt_scanner_app
description: OCR Receipt Scanner — scan, track and analyse your expenses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  image_cropper: ^7.1.0

  # Charts
  fl_chart: ^0.68.0

  # UI helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.3.1

  # File / share
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  open_file: ^3.3.2

  # External links (price-chip tap-through to maps / shop pages)
  url_launcher: ^6.3.0

  # App version for feedback emails
  package_info_plus: ^8.0.0

  # Beta analytics — PostHog events via direct HTTP (the posthog_flutter
  # SDK pinned an outdated Kotlin language version that broke the release
  # build). We lose session replay (SDK-only) but keep all custom events.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Run `dart run flutter_launcher_icons` to regenerate Android + iOS icons
# from the master at assets/icon/icon.png. Source is generated by
# tool/make_icon.py — change there, re-run script, re-run this command.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  # Adaptive icon (Android 8+): solid gradient-start background with the
  # diamond as the masked foreground. Same master used for both layers.
  adaptive_icon_background: "#22D3EE"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
